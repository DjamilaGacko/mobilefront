name: yele
description: "Yélé — Mesure de la qualité des réseaux mobiles (nouvelle app)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0

  # Networking & API
  dio: ^5.3.0

  # Lecture vidéo (test de streaming réel)
  video_player: ^2.9.2

  # Navigateur intégré (test de navigation web réel et visible)
  webview_flutter: ^4.10.0

  # Device Info & Système
  device_info_plus: ^13.1.0

  # Localisation GPS
  geolocator: ^13.0.0

  # Base de données locale
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Graphiques & Cartes
  fl_chart: ^0.65.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Utilitaires
  intl: ^0.20.2
  logger: ^2.0.0
  provider: ^6.0.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
