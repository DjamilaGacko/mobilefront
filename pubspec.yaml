name: yele
description: "Yélé — Mesure de la qualité des réseaux mobiles (nouvelle app)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & API
  dio: ^5.3.0

  # Navigateur intégré : test de navigation web ET lecteur YouTube du test
  # de streaming. Les implémentations de plateforme sont des dépendances
  # directes car on les configure explicitement (autoplay Android sans geste
  # utilisateur, lecture inline iOS) — sans quoi aucune vidéo ne démarrerait.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0

  # Device Info & Système
  device_info_plus: ^13.1.0

  # Type de connexion (WiFi / données mobiles)
  connectivity_plus: ^6.0.0

  # Localisation GPS
  geolocator: ^13.0.0

  # Base de données locale
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Cartes (couverture réseau)
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Rappels de test : notifications locales planifiées par le système.
  # `timezone` est exigé par le plugin — il refuse un DateTime brut et impose
  # une heure localisée explicite pour planifier.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utilitaires
  intl: ^0.20.2
  logger: ^2.0.0
  uuid: ^4.0.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  # Logo Yélé, partagé avec le tableau de bord web pour que les deux interfaces
  # portent la même identité.
  assets:
    - assets/yele-logo.png
